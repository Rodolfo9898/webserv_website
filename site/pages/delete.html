<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DELETE Request Demo</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
			background-color: #4a113d;
			background-size: cover;
			color: #ffffff;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			overflow: hidden;
		}

		.container {
			text-align: center;
			background: rgba(0, 0, 0, 0.7);
			padding: 30px;
			border-radius: 10px;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
		}

		h1 {
			font-size: 3em;
			margin-bottom: 20px;
		}

		form {
			margin-bottom: 20px;
		}

		p {
			min-height: 1.2em;
		}

		select,
		input[type="submit"] {
			padding: 10px;
			font-size: 1em;
			margin: 10px;
		}

		button {
			font-size: 1em;
			padding: 10px 20px;
			color: #fff;
			background-color: #007bff;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			margin-top: 20px;
			transition: background-color 0.3s ease;
		}

		button:hover {
			background-color: #0056b3;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>Delete a File</h1>
		<form id="deleteForm">
			<select id="files" name="filename" required></select>
			<input type="submit" value="Delete">
		</form>
		<p id="message"></p>
		<button onclick="window.location.href = '/';">Go Back Home</button>
	</div>
	<script>
		const select = document.getElementById('files');
		const message = document.getElementById('message');

		/* The files of the uploads folder are the links of its listing. */
		async function refresh() {
			const response = await fetch('/uploads');
			const page = new DOMParser().parseFromString(await response.text(), 'text/html');

			select.innerHTML = '';
			page.querySelectorAll('.styled-list a').forEach(function (link) {
				const href = link.getAttribute('href');

				if (href.endsWith('/') || link.textContent === '..')
					return;
				const option = document.createElement('option');
				option.value = href;
				option.textContent = link.textContent;
				select.appendChild(option);
			});
		}

		document.getElementById('deleteForm').addEventListener('submit', async function (event) {
			event.preventDefault();
			const name = select.selectedOptions[0].textContent;
			const response = await fetch(select.value, { method: 'DELETE' });

			message.textContent = response.ok ? 'Deleted ' + name : 'Could not delete ' + name + ' (' + response.status + ')';
			refresh();
		});

		refresh();
	</script>
</body>

</html>
