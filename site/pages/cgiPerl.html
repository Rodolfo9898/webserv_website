<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark light">
	<title>Perl CGI · webserv</title>
	<link rel="icon" href="/favicon.ico">
	<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('ws.theme'))||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
	<link rel="stylesheet" href="/css/main.css">
	<script src="/js/boot.js" data-page="cgiforms" defer></script>
</head>

<body data-nav="cgiperl">
	<main class="page narrow">
		<header class="page-head" data-reveal>
			<span class="eyebrow"><i data-icon="terminal"></i> CGI · Perl</span>
			<h1>Execute a <span class="grad-text">Perl script.</span></h1>
			<p class="lead">The route <code>/cgi-bin/get.pl</code> maps the extension <code>.pl</code> to its own script. The server speaks the same CGI contract whatever the language.</p>
		</header>

		<section class="card pad-lg" data-reveal>
			<h3><span class="method get">GET</span> get.pl</h3>
			<form class="stack mt" action="/cgi-bin/get.pl" method="GET" data-cgi>
				<label class="field"><span>name</span><input class="input" type="text" name="name" placeholder="Enter some data" required></label>
				<div class="row"><button class="btn sm" type="button" data-fill="larry">larry</button><button class="btn sm" type="button" data-fill="hello webserv">hello webserv</button></div>
				<label class="row"><input type="checkbox" data-inline> Inspect here instead of opening the result page</label>
				<button class="btn primary" type="submit"><i data-icon="play"></i> Execute the GET script</button>
			</form>
		</section>

		<section class="section">
			<div class="sec-head" data-reveal><h2>Raw answer</h2></div>
			<div id="out"></div>
		</section>

		<div class="row mt-lg">
			<a class="btn" href="/cgi"><i data-icon="back"></i> How CGI works</a>
			<a class="btn ghost" href="/cgiPython">Try Python instead</a>
		</div>
	</main>
</body>

</html>
