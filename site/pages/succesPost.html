<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark light">
	<title>Upload received · webserv</title>
	<link rel="icon" href="/favicon.ico">
	<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('ws.theme'))||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
	<link rel="stylesheet" href="/css/main.css">
	<script src="/js/boot.js" data-page="success" defer></script>
</head>

<!-- Served by route /succesPost: the answer to the upload form (also what a plain, no-JavaScript POST gets). -->
<body data-nav="post">
	<main class="page narrow">
		<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
		<section class="success">
			<svg class="check" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34"/><path d="M25 41l10 10 20-22"/></svg>
			<h1>Upload received</h1>
			<p class="lead">Your file was saved in the upload folder of the server.</p>
			<div class="err-actions">
				<a class="btn primary" href="/post"><i data-icon="upload"></i> Upload another</a>
				<a class="btn" href="/pages/crud.html"><i data-icon="layers"></i> Manage files</a>
				<a class="btn ghost" href="/"><i data-icon="home"></i> Home</a>
			</div>
		</section>
		<section class="section">
			<div class="sec-head"><h2>Latest files</h2><p>Read straight from <code>GET /uploads</code>.</p></div>
			<div class="card pad-sm" id="latest"></div>
		</section>
	</main>
</body>

</html>
