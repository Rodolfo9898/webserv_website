<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark light">
	<title>500 Something went wrong on the server · webserv</title>
	<link rel="icon" href="/favicon.ico">
	<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('ws.theme'))||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
	<link rel="stylesheet" href="/css/main.css">
	<script src="/js/boot.js" data-page="error" defer></script>
</head>

<!-- The current configs serve this page for 500, 502 and 504. error502.html and error504.html exist for configs that want a page per code. -->
<body>
	<main class="page err" data-code="500" style="--ec:#f87171">
		<section class="err-card">
			<div class="err-code">500</div>
			<h1>Something went wrong on the server</h1>
			<p class="lead">The request was fine, but the server failed while handling it.</p>
			<div class="err-actions">
				<a class="btn primary" href="/">Go back home</a>
				<a class="btn" href="/pages/errors.html">Open the error lab</a>
			</div>
		</section>
	</main>
</body>

</html>
