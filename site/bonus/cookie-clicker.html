<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cookie Clicker</title>
	<style>
		/* Basic Reset */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		/* Background and body styling */
		body {
			background-color: #064f12;
			font-family: 'Arial', sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			flex-direction: column;
		}

		/* Container for the entire game */
		.game-container {
			text-align: center;
			background-color: #ffffff;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
		}

		/* Title styling */
		h1 {
			font-size: 3rem;
			color: #333;
			margin-bottom: 20px;
		}

		/* Styling the cookie button */
		#cookie-button {
			background: none;
			border: none;
			cursor: pointer;
			outline: none;
			margin: 20px 0;
		}

		/* Cookie image style */
		#cookie-button img {
			width: 150px;
			transition: transform 0.2s ease;
		}

		/* Click effect on cookie */
		#cookie-button:active img {
			transform: scale(0.9);
			/* shrink the cookie when clicked */
		}

		/* Counter text styling */
		p {
			font-size: 1.8rem;
			color: #555;
		}

		/* Highlight for the count */
		#cookie-count {
			font-weight: bold;
			color: #000000;
		}

		/* Button for resetting */
		.reset-button {
			font-size: 1.2rem;
			padding: 10px 20px;
			background-color: #007bff;
			color: white;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			transition: background-color 0.3s ease;
			margin-top: 15px;
		}

		/* Hover effect for reset button */
		.reset-button:hover {
			background-color: #0056b3;
		}
		/* Where the score is kept */
		#status {
			font-size: 1rem;
			margin-top: 12px;
		}

		/* Link back to the bonus page */
		.bonus-link {
			font-size: 1.2rem;
			padding: 10px 20px;
			background-color: #007bff;
			color: white;
			border-radius: 5px;
			text-decoration: none;
			display: inline-block;
			margin: 15px 5px 0;
		}

		.bonus-link:hover {
			background-color: #0056b3;
		}
	</style>
</head>

<body>
	<div class="game-container">
		<h1>Cookie Clicker</h1>

		<!-- Cookie Button -->
		<div class="cookie-container">
			<button id="cookie-button">
				<img src="/Cookie.png" alt="Click Cookie">
			</button>
		</div>
		<div>
			<!-- Counter -->
			<p>Cookies: <span id="cookie-count">0</span></p>
			<p id="status">Looking for your session...</p>
			<!-- Reset Button -->
			<button class="reset-button" id="reset-button">Reset</button>
		</div>
		<a class="bonus-link" href="/bonus">Back to Bonus</a>
		<a class="bonus-link" href="/">Go Back Home</a>
	</div>

	<script>
		const api = '/cgi-bin/bonus/clicker.py';
		const cookieButton = document.getElementById('cookie-button');
		const cookieCountDisplay = document.getElementById('cookie-count');
		const resetButton = document.getElementById('reset-button');
		const statusLine = document.getElementById('status');

		let score = 0;
		let pending = 0;
		let hasSession = false;
		// One request at a time: the server keeps the score in the data of the session
		let queue = Promise.resolve();

		// The score of the server, or null when this server has no session
		async function call(options) {
			try {
				const response = await fetch(api, Object.assign({ cache: 'no-store' }, options));
				if (!response.ok) return null;
				const data = await response.json();
				if (data.session === false || !Number.isInteger(data.score)) return null;
				return data.score;
			} catch (error) {
				return null;
			}
		}

		function show() {
			cookieCountDisplay.textContent = score;
		}

		function setSession(found) {
			hasSession = found;
			statusLine.textContent = found
				? 'Your score is kept in your session on the server.'
				: 'No session on this server: the score is counted in this page only.';
		}

		// The score of the server replaces the local one when no click is waiting
		function send(fields) {
			pending++;
			show();
			queue = queue.then(async () => {
				if (hasSession) {
					const value = await call({ method: 'POST', body: new URLSearchParams(fields) });
					if (value === null) setSession(false);
					else if (pending === 1) score = value;
				}
				pending--;
				show();
			});
		}

		cookieButton.addEventListener('click', () => {
			score++;
			send({ click: '1' });
		});

		resetButton.addEventListener('click', () => {
			score = 0;
			send({ reset: '1' });
		});

		queue = queue.then(async () => {
			const value = await call({ method: 'GET' });
			setSession(value !== null);
			if (value !== null && pending === 0) {
				score = value;
				show();
			}
		});
	</script>
</body>

</html>
